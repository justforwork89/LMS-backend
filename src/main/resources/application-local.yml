spring:
  flyway:
    locations: classpath:db/sql,classpath:db/dev
    # dev 데이터(V100~)가 먼저 적용된 DB에도 뒤늦게 추가한 V8 이후 스크립트를 적용한다.
    out-of-order: true
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@//localhost:1521/xe}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
app:
 jwt:
   secret: ${JWT_SECRET:local-dev-only-secret-key-change-me-0123456789}
   expiration-minutes: 120
 file:                                        
   upload-dir: ${FILE_UPLOAD_DIR:D:/lms-files}
logging:
  level:
    com.dy.lms: debug